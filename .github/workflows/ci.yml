name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install development dependencies
        run: python -m pip install --require-hashes -r requirements.lock

      - name: Install product package
        run: python -m pip install --no-deps --no-build-isolation .

      - name: Check dependency compatibility
        run: python -m pip check

      - name: Run offline test suite
        run: python -m pytest -q

      - name: Check core import boundary
        run: python tools/check_architecture.py

      - name: Check exact prompt and schema bytes
        run: python tools/check_l0.py

      - name: Verify fresh installed commands outside checkout
        run: python tools/verify_install.py

      - name: Scan repository content
        if: ${{ !cancelled() }}
        run: python tools/scan_secrets.py --tracked
