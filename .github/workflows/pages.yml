name: Fixture demo Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Install hash-checked dependencies
        run: python -m pip install --require-hashes -r requirements.lock
      - name: Install current product package
        run: python -m pip install --no-deps --no-build-isolation .
      - name: Check dependencies and workflow contracts
        run: |
          python -m pip check
          python -m pytest tests/test_pages_workflow.py -q
      - name: Generate, isolate and validate fixture page
        id: stage
        shell: python
        run: |
          import os
          from pathlib import Path
          import shutil
          import subprocess
          import sys
          import tempfile

          checkout = Path.cwd()
          root = Path(tempfile.mkdtemp(prefix="world-intel-pages-"))
          demo = root / "demo"
          staging = root / "staging"
          staging.mkdir()
          subprocess.run(["world-intel", "demo", "--out", str(demo)], cwd=root, check=True)
          source = demo / "world-intel-demo.html"
          assert source.is_file() and not source.is_symlink(), "Missing regular demo HTML"
          page = staging / "index.html"
          shutil.copyfile(source, page)
          assert list(staging.rglob("*")) == [page], "Unexpected staging inventory"
          assert page.is_file() and not page.is_symlink(), "Invalid staged page"
          html = page.read_text(encoding="utf-8")
          assert "<style>" in html and "fictional" in html.lower(), "Missing embedded style or fixture label"
          subprocess.run([sys.executable, str(checkout / "tools/scan_secrets.py"), str(page)], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"path={staging}\n")
      - name: Upload only validated staging
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ steps.stage.outputs.path }}

  deploy:
    if: >-
      github.repository == 'lilnavin/world-intel-alpha' &&
      github.event.repository.private == false &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy validated fixture artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
