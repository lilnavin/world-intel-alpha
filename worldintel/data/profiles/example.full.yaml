  prompt_section: "### Canada — `briefing.canada` (2-3 CANADA stories)\nThe Canada desk: federal and provincial\
    \ politics with national consequence, public policy,\nsecurity, Indigenous affairs, society, disasters,\
    \ and Canada-specific economic developments.\nCanada has its own section because globally ranked leads\
    \ systematically crowd out important\ndomestic developments.\n\nEach story has the SAME fields and\
    \ 100-200 word wire-service body as a Japan story; there is no\n`region` field because every item\
    \ here is Canada.\n\n**Rules for the Canada section:**\n- The Brief's eligibility gates apply unchanged:\
    \ every story must resolve to a tier 1-2 item with\n  full `content`; use only URLs in the BUNDLE\
    \ and never write from a headline or teaser.\n- Single-mention rule: a Canadian story selected as\
    \ a top world story belongs only in\n  `briefing.brief`, not here.\n- National consequence is required.\
    \ Exclude municipal colour, routine crime, consumer service,\n  opinion, and provincial stories without\
    \ wider policy, economic, security, or lives-at-scale\n  stakes.\n- Availability-conditioned target:\
    \ if at least 3 Canada-desk items qualify, publish 2-3 distinct\n  stories; if 1-2 qualify, publish\
    \ all that qualify; use `[]` only when none qualify. Return fewer\n  rather than padding, and do not\
    \ publish two cards about the same event.\n\r\n"
