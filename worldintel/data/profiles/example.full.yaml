  prompt_section: "### Japan — `briefing.japan` (3–4 JAPAN stories)\r\nThe Japan desk: domestic politics,\
    \ policy, security, society, disasters, and Japan-specific\r\neconomic developments. This section\
    \ exists because The Brief is world-affairs-first and ranks by\r\nglobal impact, which means a Diet\
    \ vote, a prefectural evacuation or a Bank of Japan personnel\r\ndecision loses to a war every single\
    \ day and never gets written at all. Here it gets written.\r\n\r\nEach story has the SAME fields as\
    \ a Brief story — `headline`, `why_it_matters`, `body`, `sources`,\r\n`tags` — and there is NO `region`\
    \ field: every item here is Japan.\r\n- `body`: **100–200 words**, inverted pyramid, the same wire-service\
    \ register and the same hard\r\n  bans as The Brief. This is not a summary section; it is the same\
    \ craft on a Japanese story.\r\n\r\n**Rules for the Japan section:**\n- **The Brief's eligibility\
    \ gates apply here UNCHANGED.** A Japan story must be grounded in an item\r\n  carrying `content`\
    \ — a body written from a bare headline is padding here exactly as it is there.\r\n  Do NOT headline\
    \ a story whose only source is `tier` 3. Never invent a URL: use only URLs present\r\n  in the BUNDLE,\
    \ or an empty `sources` array.\r\n- **Single-mention rule.** If a Japan story is genuinely a top world\
    \ story, it belongs in\r\n  `briefing.brief` and is described IN FULL there — it is NOT repeated here.\
    \ Reference it at most.\r\n  This section is for the Japan stories that would otherwise never be written.\r\
    \n- Availability-conditioned target: count the Japan-desk items that carry `content`, are tier 1-2,\n\
    \  and are nationally consequential. If at least 3 qualify, publish 3-4. If 1-2 qualify, publish all\n\
    \  that qualify. Use `[]` only when none qualify. This is a coverage floor over good material, never\n\
    \  permission to stretch a weak or headline-only item.\n\n"
